<script src="figure.js?v=4"></script><script>

 <div class="hud"><div class="clock">#1</div><div class="lbl">в банде</div><div class="money">$00008120</div><div class="lbl">тоннаж, кг</div><div class="stars">★★★★★</div><div class="lbl">5 недель подряд</div></div>
 <div style="position:absolute;left:50%;top:124px;transform:translateX(-50%)">${drawFigure(1,{gear:'gang',stage:5,w:240,h:416})}</div>
 <div style="position:absolute;right:14px;top:300px;display:grid;gap:4px;justify-items:end"><span class="stencil g" style="font-size:8px">ВЧЕРА: ГРУДЬ</span><span class="stencil" style="font-size:8px">24 ТРОФЕЯ</span><span class="stencil" style="font-size:8px">🔥 142 МИССИИ</span></div>
 <div class="pm" style="position:absolute;left:14px;right:14px;bottom:142px">

   <div style="background:#000;border:2px solid #3a342c;padding:8px"><div class="mono" style="font-size:14px;color:#fff">120</div><div class="osw" style="font-size:8px;color:#999">жим · ты 82.5</div></div>
   <div style="background:#000;border:2px solid #3a342c;padding:8px"><div class="mono" style="font-size:14px;color:#fff">170</div><div class="osw" style="font-size:8px;color:#999">присед · ты 100</div></div>
   <div style="background:#000;border:2px solid #3a342c;padding:8px"><div class="mono" style="font-size:14px;color:#fff">200</div><div class="osw" style="font-size:8px;color:#999">тяга · ты 120</div></div>
  </div>
 </div>
 <div style="position:absolute;left:14px;right:14px;bottom:80px;display:flex;gap:10px"><div class="cta dark" style="flex:1">⚔️ ВЫЗВАТЬ НА НЕДЕЛЮ</div><div class="cta dark" style="width:110px;color:#ff5c5c;border-color:#c8322a">УБРАТЬ</div></div>

 <div style="position:absolute;left:14px;top:12px"><div class="tag" style="font-size:30px;line-height:1">ПОЗВАТЬ</div><div style="margin-top:6px"><span class="stencil y">В БАНДУ</span></div></div>

P.forEach(([l, html], i) => { if (only && String(i + 1) !== only) return; host.insertAdjacentHTML('beforeend', `<div>${only ? '' : `<div class="label">${l}</div>`}<div class="phone" ${only ? 'style="border:0;border-radius:0;box-shadow:none"' : ''}>${html}</div></div>`); });
