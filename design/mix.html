 </div>
 <div style="position:absolute;left:14px;right:14px;bottom:80px;display:flex;gap:10px"><div class="cta dark" style="width:100px;color:#e23c3c;border-color:#e23c3c">ОТМЕНА</div><div class="cta" style="flex:1">🏁 ЗАВЕРШИТЬ</div></div>

P.push(['3 · Статы', `<div class="scr">${sunset(300)}<div style="position:absolute;left:0;right:0;top:230px;bottom:0;background:#0d0c0b"></div><div class="halftone" style="opacity:.2"></div>

</script></body></html>
